<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: o;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        height: 100vh;
        width: 100%;
        position: relative;
    }
    .box{
        position: absolute;
        top: 50px;
        left:30px;
        width: 100px;
         animation-name: move;
         animation-delay: 2s;
       animation-iteration-count: infinite;
       animation-duration: 20s;
    }
     @keyframes move{
            0%{
                margin-left: 10px;
           
            }
            25%{
                margin-top:200px ;
            }
            50%{
                margin-top: 60px;
            }
            75%{
                margin-left: 100%;
        }
        }
     
     
</style>
<body>
    <div class="container">
    

       
        <img src="./output-onlinegiftools.gif" alt="" style="height: 200px; width: 200px;" class="box">
        
          <img src="./background.jpg" alt="" style="height: 100vh; width: 100%;" class="background">
        
     
       
    </div>
</body>
</html>
